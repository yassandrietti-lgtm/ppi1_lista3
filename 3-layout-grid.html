<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 370px;
            height: 280px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: repeat(4, 1fr);
            grid-template-areas:
                "um um um"
                "dois tres quatro"
                "cinco tres seis"
                "cinco sete sete";
            gap: 5px;
        }

        .item {
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }

        .item1 {
            grid-area: um;
            background-color: #ffda80;
        }

        .item2 {
            grid-area: dois;
            background-color: #ef4165;
        }

        .item3 {
            grid-area: tres;
            background-color: #ffda80;
        }

        .item4 {
            grid-area: quatro;
            background-color: #ef4165;
        }

        .item5 {
            grid-area: cinco;
            background-color: #ffda80;
        }

        .item6 {
            grid-area: seis;
            background-color: #ef4165;
        }

        .item7 {
            grid-area: sete;
            background-color: #ffda80;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
        <div class="item item6">6</div>
        <div class="item item7">7</div>

    </div>

</body>
</html>
