<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Responsivo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .layout {
            width: 500px;
            height: 250px;
            margin: auto;
            padding: 8px;
            background-color: white;
            display: grid;
            grid-template-columns: 25px 1fr;
            gap: 5px;
        }

        /* CÍRCULOS */
        .circulos {
            display: flex;
            flex-direction: column;
            gap: 7px;
            align-items: center;
        }

        .circulo {
            width: 15px;
            height: 15px;
            border-radius: 50%;
        }

        .c1 { background-color: #f49a69; }
        .c2 { background-color: #b6c99c; }
        .c3 { background-color: #cdb9dc; }
        .c4 { background-color: #f5ad24; }

        /* QUADRADOS E RETÂNGULOS */
        .blocos {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 4px;
        }

        .bloco {
            border: 2px solid white;
        }

        .azul {
            background-color: #b5c9df;
            grid-column: 1 / 3;
        }

        .amarelo {
            background-color: #f5ad24;
            grid-column: 3;
            grid-row: 1 / 3;
        }

        .rosa {
            background-color: #d6aaaa;
            grid-column: 1;
        }

        .verde-claro {
            background-color: #c4d9d9;
            grid-column: 2;
        }

        .coral {
            background-color: #f3b3a1;
            grid-column: 1 / 3;
        }

        .verde {
            background-color: #b6c66f;
            grid-column: 3;
            grid-row: 3;
        }

        /* RESPONSIVIDADE */
        @media screen and (max-width: 500px) {

            body {
                padding: 15px;
            }

            .layout {
                width: 100%;
                height: 350px;
                grid-template-columns: 20px 1fr;
            }

            .blocos {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(4, 1fr);
            }

            .azul {
                grid-column: 1 / 3;
                grid-row: 1;
            }

            .amarelo {
                grid-column: 2;
                grid-row: 2 / 4;
            }

            .rosa {
                grid-column: 1;
                grid-row: 2;
            }

            .verde-claro {
                grid-column: 1;
                grid-row: 3;
            }

            .coral {
                grid-column: 1;
                grid-row: 4;
            }

            .verde {
                grid-column: 2;
                grid-row: 4;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <div class="circulos">
            <div class="circulo c1"></div>
            <div class="circulo c2"></div>
            <div class="circulo c3"></div>
            <div class="circulo c4"></div>
        </div>

        <div class="blocos">

            <div class="bloco azul"></div>
            <div class="bloco amarelo"></div>
            <div class="bloco rosa"></div>
            <div class="bloco verde-claro"></div>
            <div class="bloco coral"></div>
            <div class="bloco verde"></div>

        </div>

    </div>

</body>
</html>
